name: Bug Report
description: Create a report to help us reproduce and fix an issue
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting an issue in SurakshaShield!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact steps or inputs to reproduce the behavior.
      placeholder: |
        1. Paste sample threat text
        2. Tap Analyze
        3. See unexpected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device / Browser
      placeholder: iOS Safari / Android Chrome / Windows Edge
    validations:
      required: false
