name: Feature Request
description: Suggest an idea or enhancement for SurakshaShield
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thank you for contributing ideas to make Indian cyberspace safer!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a new fraud typology or threat vector?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what capability or enhancement you would like to see.
    validations:
      required: true
